services:
  traefik:
    image: traefik:v3.2
    container_name: hackathon-dev-traefik
    command:
      - --api.dashboard=true
      - --api.insecure=true
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --log.level=INFO
    ports:
      - "80:80"
      - "8089:8080"
    volumes:
      - ./traefik/dev-dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks:
      - hackathon-dev

  nats:
    image: nats:2.10.27
    container_name: hackathon-dev-nats
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    networks:
      - hackathon-dev

  redis:
    image: redis:7-alpine
    container_name: hackathon-dev-redis
    ports:
      - "6379:6379"
    networks:
      - hackathon-dev

  postgres:
    image: postgres:16-alpine
    container_name: hackathon-dev-postgres
    environment:
      POSTGRES_DB: users
      POSTGRES_USER: ghost
      POSTGRES_PASSWORD: strongPassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - hackathon-dev

  lgtm:
    image: grafana/otel-lgtm:latest
    ports:
      - "3000:3000"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes:
      - lgtm_data:/data
    networks:
      - hackathon-dev

  alloy:
    image: grafana/alloy:latest
    command: ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    volumes:
      - ./monitoring/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    environment:
      COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-infra}
    depends_on:
      - lgtm
    networks:
      - hackathon-dev

  agent:
    image: template-agent:dev
    build:
      context: ../agent
      dockerfile: Dockerfile
    environment:
      AGENT_PORT: "50051"
    ports:
      - "50051:50051"
    networks:
      - hackathon-dev

  notif:
    restart: on-failure
    image: template-back-notif:dev
    build:
      context: ../backend/notif
      dockerfile: Dockerfile
    environment:
      NATS_URL: "nats://nats:4222"
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    depends_on:
      - nats
    networks:
      - hackathon-dev

  auth:
    restart: on-failure
    image: template-back-auth:dev
    build:
      context: ../backend/auth
      dockerfile: Dockerfile
    environment:
      PORT: "8080"
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      REDISURL: "redis://redis:6379/0"
      NATS: "nats://nats:4222"
      POSTGRES: "host=postgres port=5432 user=ghost password=strongPassword dbname=users sslmode=disable"
    depends_on:
      - postgres
      - redis
      - nats
    networks:
      - hackathon-dev

  core:
    restart: on-failure
    image: template-back-core:dev
    build:
      context: ../backend/core
      dockerfile: Dockerfile
    environment:
      PORT: "8081"
      AUTH_URL: "http://auth:8080"
      AGENT_HOST: "agent"
      AGENT_PORT: "50051"
    depends_on:
      - agent
      - auth
    networks:
      - hackathon-dev


volumes:
  postgres_dev_data:
  lgtm_data:
  alloy_data:

networks:
  hackathon-dev:
    driver: bridge
